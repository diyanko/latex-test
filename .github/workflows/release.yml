name: Release LaTeX PDF

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (use YYYY-MM-DD or YYYY-MM-DD.1)"
        required: true
        default: "2026-04-09"
      effective_date:
        description: "Effective date shown in the release title and PDF asset name"
        required: true
        default: "2026-04-09"
      approval_record_url:
        description: "Approval record URL (minutes, vote record, or approval issue)"
        required: true
      change_summary:
        description: "Short summary of what this official version changed"
        required: true
        default: "Sample ratified release for repository demonstration."

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Prepare dated release asset
        run: cp main.pdf "bylaws-${{ inputs.effective_date }}.pdf"

      - name: Create GitHub release and upload PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Bylaws effective ${{ inputs.effective_date }}
          target_commitish: ${{ github.sha }}
          body: |
            Official ratified version.

            Effective date: ${{ inputs.effective_date }}
            Approval record: ${{ inputs.approval_record_url }}
            Summary: ${{ inputs.change_summary }}
          files: |
            bylaws-${{ inputs.effective_date }}.pdf
